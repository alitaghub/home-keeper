name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  hardware-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: uv sync --locked --python 3.13
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: bash -n scripts/start-home.sh scripts/connect-home.sh
      - run: docker compose -f compose.home-assistant.yaml config --quiet
      - run: docker compose config --quiet
      - run: docker compose up --build --wait
      - run: uv run python e2e/compose_smoke.py
      - run: uv run python e2e/compose_live_smoke.py
      - if: always()
        run: docker compose down
