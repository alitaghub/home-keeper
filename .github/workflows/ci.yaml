name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Each job runs a mise task, so CI and local runs execute the same commands.
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.9.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/pnpm/store
          key: deps-${{ runner.os }}-${{ hashFiles('uv.lock', 'pnpm-lock.yaml') }}
          restore-keys: deps-${{ runner.os }}-
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - run: mise run check

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.9.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/pnpm/store
          key: deps-${{ runner.os }}-${{ hashFiles('uv.lock', 'pnpm-lock.yaml') }}
          restore-keys: deps-${{ runner.os }}-
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @home-observer/web exec playwright install --with-deps chromium
      - run: mise run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-failure
          path: |
            compose-logs.txt
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
