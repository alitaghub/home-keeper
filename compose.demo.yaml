# Synthetic demo, no hardware or Home Assistant: `docker compose -f compose.demo.yaml up --build --wait`.
name: home-keeper-demo
# Add `--profile agent` to also start the chat agent (compose.agent.yaml).
include:
  - compose.agent.yaml
services:
  api:
    build: .
    ports:
      - "127.0.0.1:${HOME_KEEPER_PORT:-8000}:${HOME_KEEPER_PORT:-8000}"
    environment:
      HOME_KEEPER_PORT: ${HOME_KEEPER_PORT:-8000}
      HOME_KEEPER_BIND: 0.0.0.0
      HOME_KEEPER_RETENTION_DAYS: ${HOME_KEEPER_RETENTION_DAYS:-30}
      HOME_KEEPER_RECONCILIATION_SECONDS: ${HOME_KEEPER_RECONCILIATION_SECONDS:-10}
      HOME_KEEPER_TIMEZONE: ${HOME_KEEPER_TIMEZONE:-UTC}
      # Old names forwarded bare, so a leftover .env value fails the startup check.
      OBSERVER_PORT:
      OBSERVER_BIND:
      OBSERVER_DB:
      OBSERVER_SOURCE_ID:
      OBSERVER_TOKEN_FILE:
      OBSERVER_HA_PUBLIC_URL:
      OBSERVER_RETENTION_DAYS:
      OBSERVER_RECONCILIATION_SECONDS:
      OBSERVER_TIMEZONE:
    volumes:
      - data:/data
      - service-secret:/secrets
    networks: [dashboard, collection]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${HOME_KEEPER_PORT:-8000}/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
  collector:
    build: .
    command: [python, -m, home_keeper.demo]
    environment:
      HOME_KEEPER_PORT: ${HOME_KEEPER_PORT:-8000}
      HOME_KEEPER_RECONCILIATION_SECONDS: ${HOME_KEEPER_RECONCILIATION_SECONDS:-10}
      # Old names forwarded bare, so a leftover .env value fails the startup check.
      OBSERVER_PORT:
      OBSERVER_TOKEN_FILE:
      OBSERVER_RECONCILIATION_SECONDS:
    volumes:
      - service-secret:/secrets:ro
    networks: [collection]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      api:
        condition: service_healthy
networks:
  dashboard:
  collection:
    internal: true
volumes:
  data:
  service-secret:
