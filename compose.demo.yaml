# Synthetic demo, no hardware or Home Assistant: `docker compose -f compose.demo.yaml up --build --wait`.
name: home-keeper-demo
# Add `--profile agent` to also start the chat agent (compose.agent.yaml), and
# `--profile control` to switch the synthetic lights.
include:
  - compose.postgres.yaml
  - compose.agent.yaml
services:
  api:
    build: .
    ports:
      - "127.0.0.1:${HOME_KEEPER_PORT:-8000}:${HOME_KEEPER_PORT:-8000}"
    environment:
      HOME_KEEPER_PORT: ${HOME_KEEPER_PORT:-8000}
      HOME_KEEPER_BIND: 0.0.0.0
      HOME_KEEPER_RETENTION_DAYS: ${HOME_KEEPER_RETENTION_DAYS:-30}
      HOME_KEEPER_TIMEZONE: ${HOME_KEEPER_TIMEZONE:-UTC}
      HOME_KEEPER_CONTROLLER_URL: http://controller:8080
      HOME_KEEPER_READER_URL: http://reader:8080
      HOME_KEEPER_DATABASE_URL: postgresql://keeper@postgres:5432/keeper
      HOME_KEEPER_DATABASE_PASSWORD_FILE: /db-password/password
    volumes:
      - service-secret:/secrets
      - keeper-db-password:/db-password:ro
    networks: [dashboard, collection, control, database]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${HOME_KEEPER_PORT:-8000}/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
    depends_on:
      db-setup:
        condition: service_completed_successfully
  # Serves the synthetic home to the API, like the reader of compose.yaml serves Home Assistant.
  reader:
    build: .
    command: [python, -m, home_keeper.reader_service]
    restart: unless-stopped
    environment:
      HOME_KEEPER_READER_BACKEND: demo
    volumes:
      - service-secret:/secrets:ro
    # `control` carries the demo controller's commands to the synthetic home.
    networks: [collection, control]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Healthy once it accepts connections, whether or not Home Assistant answers, so
    # `up --wait` does not return before the API can reach it.
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1', 8080), 3).close()"]
      interval: 2s
      timeout: 4s
      retries: 15
    depends_on:
      api:
        condition: service_healthy
  # Opt-in light control: forwards the API's commands to the demo reader.
  controller:
    profiles: [control]
    build:
      context: .
      dockerfile: apps/controller/Dockerfile
    restart: unless-stopped
    environment:
      HOME_KEEPER_PORT: ${HOME_KEEPER_PORT:-8000}
      HOME_KEEPER_CONTROL_BACKEND: demo
    volumes:
      - service-secret:/secrets:ro
    # No published port: only the API reaches it, over `control`.
    networks: [control]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      api:
        condition: service_healthy
      reader:
        condition: service_healthy
networks:
  dashboard:
  collection:
    internal: true
  # The API, the controller and the demo reader.
  control:
    internal: true
volumes:
  service-secret:
