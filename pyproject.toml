# Workspace root. Each app or package under apps/ and packages/ owns its own
# pyproject.toml; this file holds the shared dev tools and tool configuration.
[project]
name = "home-observer-workspace"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["home-observer"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.uv.sources]
home-observer = { workspace = true }

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.pytest.ini_options]
testpaths = ["apps/observer/tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
# Resolve workspace packages as first-party imports.
src = [".", "apps/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
