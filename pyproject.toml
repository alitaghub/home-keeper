# Workspace root. Each app or package under apps/ and packages/ owns its own
# pyproject.toml; this file holds the shared dev tools and tool configuration.
[project]
name = "home-keeper-workspace"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["home-keeper", "home-keeper-agent", "home-keeper-controller"]

[dependency-groups]
dev = [
    "basedpyright>=1.40,<2",
    "pytest>=8,<9",
    "pytest-cov>=7.1,<8",
    # scripts/check_env.py reads the Compose files.
    "pyyaml>=6,<7",
    "ruff>=0.11,<1",
    "types-pyyaml>=6,<7",
]

[tool.uv]
package = false

[tool.uv.sources]
home-keeper = { workspace = true }
home-keeper-agent = { workspace = true }
home-keeper-controller = { workspace = true }
home-keeper-light-command = { workspace = true }
home-keeper-settings = { workspace = true }

[tool.uv.workspace]
members = ["apps/*", "packages/*"]
# The web app and the chat image are not Python projects.
exclude = ["apps/web", "apps/chat"]

[tool.pytest.ini_options]
testpaths = [
    "apps/keeper/tests/unit",
    "apps/keeper/tests/integration",
    "apps/agent/tests/unit",
    "apps/agent/tests/integration",
    "apps/controller/tests/unit",
    "apps/controller/tests/integration",
    "packages/settings/tests/unit",
    "tests",
]
# Shared test helpers live in apps/keeper/tests/support and apps/agent/tests/agent_support.py;
# repo tooling lives in scripts.
pythonpath = ["apps/keeper/tests", "apps/agent/tests", "scripts"]
# importlib mode lets each app keep test files with the same basename.
addopts = ["--strict-markers", "--import-mode=importlib"]
# Every warning fails the run. Ignore only known third-party warnings, each with a reason.
filterwarnings = [
    "error",
    # Starlette's TestClient asks for httpx2; the workspace stays on httpx, which it supports.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
branch = true
source_pkgs = [
    "home_keeper",
    "home_keeper_agent",
    "home_keeper_controller",
    "home_keeper_light_command",
    "home_keeper_settings",
]

[tool.coverage.report]
# A few points under measured coverage, so refactors don't trip it but real drops do.
fail_under = 83
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 100
# Resolve workspace packages as first-party imports.
src = [".", "apps/*/src", "packages/*/src"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PT", "PL", "S", "ASYNC", "DTZ", "TRY",
    "PERF", "C4", "RET", "PTH", "N",
]

ignore = [
    # Adapters raise inside `try` so one handler maps every failure to a fixed, safe code.
    "TRY301",
    # Exception messages are fixed, secret-free strings; a class per message adds nothing.
    "TRY003",
    # logging.exception prints exception text, which can carry credentials; logs stay fixed.
    "TRY400",
    # The app factory registers every route as a closure; scenario tests read top to bottom.
    "PLR0915",
    # The app factory, FastAPI routes and change_event take their inputs as named parameters.
    "PLR0913",
    # Boundary validation reads best as one flat chain of explicit checks.
    "PLR0912",
]

[tool.ruff.lint.per-file-ignores]
# Tests: pytest's assert rewriting is the idiom, literal expected values read best inline,
# and every credential is a synthetic fixture.
"{apps,packages}/*/tests/**" = ["S101", "PLR2004", "S105", "S106"]
# Smoke scripts assert like tests, use synthetic credentials, and drive docker and HTTP.
"e2e/**" = ["S101", "PLR2004", "S105", "S310", "S603", "S607"]
# Repo tooling tests assert like app tests and run the hook scripts with bash.
"tests/**" = ["S101", "S603", "S607"]
# Repo tooling runs gh from PATH with fixed arguments.
"scripts/**" = ["S603", "S607"]
# Type stubs re-export whole modules.
"typings/**" = ["F403"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
# Read installed packages from the uv workspace environment, not whatever python is on PATH.
venvPath = "."
venv = ".venv"
include = [
    "apps/keeper/src",
    "apps/keeper/tests",
    "apps/agent/src",
    "apps/agent/tests",
    "apps/controller/src",
    "apps/controller/tests",
    "packages/light-command/src",
    "packages/settings/src",
    "packages/settings/tests",
    "e2e",
    "scripts",
    "tests",
]
# Resolve the workspace packages, the shared test helpers and repo tooling as local source.
extraPaths = [
    "apps/keeper/src",
    "apps/keeper/tests",
    "apps/agent/src",
    "apps/agent/tests",
    "apps/controller/src",
    "apps/controller/tests",
    "packages/light-command/src",
    "packages/settings/src",
    "scripts",
]
# Local stubs; see typings/httpx2/__init__.pyi.
stubPath = "typings"
