[project]
name = "home-keeper-settings"
version = "0.1.0"
description = "Loads each Home Keeper service's environment into a typed settings model"
requires-python = ">=3.13"
dependencies = ["pydantic>=2,<3", "pydantic-settings>=2.7,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
