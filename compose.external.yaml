# Use your own Home Assistant instead of the bundled one:
#   docker compose -f compose.yaml -f compose.external.yaml up --build --wait
services:
  # Profiles that are never enabled keep the bundled Home Assistant and its setup off.
  homeassistant:
    profiles: [bundled]
  ha-setup:
    profiles: [bundled]
  api:
    environment:
      HOME_KEEPER_HA_PUBLIC_URL: ${HOME_KEEPER_HA_PUBLIC_URL:-}
  collector:
    environment:
      HOME_KEEPER_HA_URL: ${HOME_KEEPER_HA_URL:?Set the Home Assistant origin}
      HOME_KEEPER_HA_TOKEN_FILE: /run/secrets/ha-token
    volumes: !override
      - service-secret:/secrets:ro
      - type: bind
        source: ${HOME_KEEPER_HA_TOKEN_FILE:?Set the absolute token file path}
        target: /run/secrets/ha-token
        read_only: true
        bind:
          create_host_path: false
    depends_on: !override
      api:
        condition: service_healthy
  # With `--profile control`: the token of a non-admin Home Assistant user you create.
  # See docs/home-assistant.md. Compose checks `:?` even with the profile off, so a
  # missing setting shows up as this placeholder path when the controller starts.
  controller:
    environment:
      HOME_KEEPER_HA_URL: ${HOME_KEEPER_HA_URL:?Set the Home Assistant origin}
      HOME_KEEPER_HA_CONTROL_TOKEN_FILE: /run/secrets/ha-control-token
    volumes: !override
      - service-secret:/secrets:ro
      - type: bind
        source: ${HOME_KEEPER_HA_CONTROL_TOKEN_FILE:-/nonexistent/set-HOME_KEEPER_HA_CONTROL_TOKEN_FILE}
        target: /run/secrets/ha-control-token
        read_only: true
        bind:
          create_host_path: false
    depends_on: !override
      api:
        condition: service_healthy
