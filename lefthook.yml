# Fast checks on staged files only. Types and tests run in `mise run check` and CI.
pre-commit:
  parallel: true
  commands:
    ruff:
      glob: "*.py"
      run: uv run ruff format {staged_files} && uv run ruff check --fix {staged_files}
      stage_fixed: true
    biome:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
