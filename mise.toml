[tools]
python = "3.13.16"
node = "24.20.0"
pnpm = "12.10.1"
uv = "0.13.0"
actionlint = "1.7.12"
zizmor = "1.30.1"
lefthook = "2.2.1"
# Claude Code hooks in .claude/hooks parse their JSON input with jq.
jq = "1.8.1"

[tasks.setup]
description = "Install tools and dependencies, then the lefthook pre-commit hook"
# Chromium for `mise run e2e`. System libraries need sudo, so only CI passes --with-deps.
run = [
  "mise install",
  "pnpm install",
  "uv sync",
  "pnpm --filter @home-keeper/web exec playwright install chromium",
  "lefthook install",
]

[tasks.lint]
description = "Lint Python (ruff) and the web app (Biome)"
run = ["uv run ruff check .", "pnpm exec biome check ."]

[tasks.fmt]
description = "Format Python (ruff) and the web app (Biome)"
run = ["uv run ruff format .", "pnpm exec biome format --write ."]

[tasks.typecheck]
description = "Type-check Python (basedpyright, strict) and the web app (tsc)"
run = ["uv run basedpyright", "pnpm -r typecheck"]

[tasks.test]
description = "Run Python and web tests with coverage"
run = ["uv run pytest -q --cov", "pnpm -r test"]

[tasks.check]
description = "Run every hardware-free check CI runs"
run = [
  "mise run lint",
  "uv run ruff format --check .",
  "mise run typecheck",
  "mise run test",
  "pnpm --filter @home-keeper/web build",
  "mise run check:api",
  "mise run check:env",
  "mise run lint:workflows",
]

[tasks."lint:workflows"]
description = "Lint GitHub Actions workflows (actionlint, zizmor)"
run = ["actionlint", "zizmor .github"]

[tasks."gen:api"]
description = "Generate the web app's API types from the keeper's OpenAPI schema"
run = """
schema=$(mktemp --suffix=.json)
trap 'rm -f "$schema"' EXIT
uv run python -m home_keeper.openapi > "$schema"
pnpm exec openapi-typescript "$schema" --output apps/web/src/api/schema.d.ts
"""

[tasks."check:api"]
description = "Fail when the generated API types are stale"
run = [
  "pnpm install --frozen-lockfile",
  "mise run gen:api",
  "git diff --exit-code -- apps/web/src/api/schema.d.ts",
]

[tasks."check:env"]
description = "Fail when .env.example or Compose drift from what the services read"
run = "uv run python scripts/check_env.py"

[tasks."pr:images"]
description = "Upload screenshots and add them to a pull request's description"
run = "uv run python scripts/pr_images.py"

[tasks.dev]
description = "Start the demo stack, then the Vite dev server with /api proxied to it"
run = """
docker compose -f compose.demo.yaml up --build --wait
HOME_KEEPER_API_ORIGIN="http://127.0.0.1:${HOME_KEEPER_PORT:-8000}" pnpm --filter @home-keeper/web dev
"""

[tasks.e2e]
description = "Run the Compose smoke scripts, the Playwright suite and the agent smoke against fresh stacks"
run = """
# On failure, keep the demo stack's logs for debugging (CI uploads them).
# The profiles make logs and down cover the agent and controller services too.
trap 'status=$?; [ "$status" -eq 0 ] || docker compose -f compose.demo.yaml --profile agent --profile control logs --no-color > compose-logs.txt; docker compose -f compose.demo.yaml --profile agent --profile control down' EXIT
docker compose config --quiet
docker compose --profile agent config --quiet
docker compose --profile control config --quiet
docker compose -f compose.demo.yaml --profile control config --quiet
# The controller lets the Playwright suite switch a demo light from the dashboard.
docker compose -f compose.demo.yaml --profile control up --build --wait
uv run python e2e/compose_smoke.py
uv run python e2e/compose_live_smoke.py
uv run python e2e/compose_home_smoke.py
E2E_BASE_URL="${E2E_BASE_URL:-http://127.0.0.1:${HOME_KEEPER_PORT:-8000}}" pnpm --filter @home-keeper/web e2e
# Add the agent profile to the running demo stack. The model settings are
# placeholders with a valid shape; the smoke never calls the model.
AZURE_OPENAI_ENDPOINT=https://placeholder.invalid AZURE_OPENAI_API_KEY=placeholder \
  docker compose -f compose.demo.yaml --profile agent --profile control up --build --wait
uv run python e2e/compose_agent_smoke.py
# Release the completed demo before the isolated control and Telegram proofs start their stacks.
docker compose -f compose.demo.yaml --profile agent --profile control down
uv run python e2e/compose_control_smoke.py
uv run python e2e/compose_telegram_smoke.py
"""
