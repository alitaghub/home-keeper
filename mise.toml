[tools]
python = "3.13.16"
node = "24.20.0"
pnpm = "12.10.1"
uv = "0.13.0"

[tasks.lint]
description = "Lint Python"
run = "uv run ruff check ."

[tasks.fmt]
description = "Format Python"
run = "uv run ruff format ."

[tasks.typecheck]
description = "Type-check Python with basedpyright (strict)"
run = "uv run basedpyright"

[tasks.test]
description = "Run Python tests with branch coverage"
run = "uv run pytest -q --cov"

[tasks.check]
description = "Run every hardware-free check CI runs"
run = [
  "mise run lint",
  "uv run ruff format --check .",
  "mise run typecheck",
  "mise run test",
  "node --check web/app.js",
  "bash -n scripts/start-home.sh scripts/connect-home.sh",
  "mise run check:api",
]

[tasks."gen:api"]
description = "Generate the web app's API types from the observer's OpenAPI schema"
run = """
schema=$(mktemp --suffix=.json)
trap 'rm -f "$schema"' EXIT
uv run python -m home_observer.openapi > "$schema"
pnpm exec openapi-typescript "$schema" --output apps/web/src/api/schema.d.ts
"""

[tasks."check:api"]
description = "Fail when the generated API types are stale"
run = [
  "pnpm install --frozen-lockfile",
  "mise run gen:api",
  "git diff --exit-code -- apps/web/src/api/schema.d.ts",
]

[tasks.dev]
description = "Start the demo stack on 127.0.0.1:8000"
run = "docker compose up --build --wait"
