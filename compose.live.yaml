# Use with compose.yaml. Home Assistant remains an external dependency.
services:
  api:
    environment:
      OBSERVER_SOURCE_ID: home_assistant
    volumes:
      - live-data:/data
  collector:
    command: [python, -m, home_observer.live]
    environment:
      OBSERVER_HA_URL: ${OBSERVER_HA_URL:?Set the Home Assistant origin}
      OBSERVER_HA_TOKEN_FILE: /run/secrets/ha-token
    volumes:
      - type: bind
        source: ${OBSERVER_HA_TOKEN_FILE:?Set the absolute token file path}
        target: /run/secrets/ha-token
        read_only: true
        bind:
          create_host_path: false
    networks: [collection, live]
networks:
  live:
volumes:
  live-data:
