[project]
name = "home-keeper-agent"
version = "0.1.0"
description = "Chat agent that answers questions from the Home Keeper API"
requires-python = ">=3.13"
# Exact pins: the agent stack moves fast and the image must match what the tests ran.
dependencies = [
    "deepagents==0.7.25",
    "home-keeper-light-command",
    "httpx>=0.28,<1",
    "langchain==1.4.5",
    "langchain-openai==1.7.1",
    "langgraph==1.2.15",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
# Aegra serves the graph in the image only; tests import the graph directly.
serve = ["aegra-cli==0.10.8"]

[tool.uv.sources]
home-keeper-light-command = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
