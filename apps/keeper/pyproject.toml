[project]
name = "home-keeper"
version = "0.1.0"
description = "Local smart-home recording and opt-in light control with explicit device selection"
requires-python = ">=3.13"
dependencies = [
    "home-keeper-light-command",
    "home-keeper-settings",
    "anyio>=4,<5",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "websockets>=15,<16",
    "psycopg[binary]>=3.3,<4",
    "psycopg-pool>=3.3,<4",
]

[tool.uv.sources]
home-keeper-light-command = { workspace = true }
home-keeper-settings = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
