[project]
name = "home-observer"
version = "0.1.0"
description = "Local smart-home observation with explicit device selection"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "websockets>=15,<16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
