# Home Keeper with a bundled Home Assistant: `docker compose up --build --wait`.
name: home-keeper
# The demo lives in compose.demo.yaml; your own Home Assistant uses compose.external.yaml.
# Add `--profile agent` to also start the chat agent (compose.agent.yaml), and
# `--profile control` to let the API switch monitored lights.
include:
  - compose.postgres.yaml
  - compose.web.yaml
  - compose.agent.yaml
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HA_PORT:-8123}:8123"
    volumes:
      - home-assistant-config:/config
    networks: [home-assistant]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
  # Onboards Home Assistant once and stores the reader's and the controller's tokens.
  # Exits when done.
  ha-setup:
    build: .
    entrypoint: [python, -m, home_keeper.ha_setup]
    command: [setup]
    environment:
      HOME_KEEPER_HA_URL: http://homeassistant:8123
      HOME_KEEPER_HA_PUBLIC_URL: http://127.0.0.1:${HA_PORT:-8123}
      HOME_KEEPER_HA_CONTROL_TOKEN_FILE: /ha-control-token/token
    volumes:
      - ha-token:/ha-token
      - ha-owner:/ha-owner
      - ha-control-token:/ha-control-token
    networks: [home-assistant]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      homeassistant:
        condition: service_started
  api:
    build: .
    # No published port: the browser reaches it through `web` (compose.web.yaml).
    environment:
      HOME_KEEPER_PORT: ${HOME_KEEPER_PORT:-8000}
      HOME_KEEPER_BIND: 0.0.0.0
      HOME_KEEPER_SOURCE_ID: home_assistant
      HOME_KEEPER_HA_PUBLIC_URL: http://127.0.0.1:${HA_PORT:-8123}
      HOME_KEEPER_RETENTION_DAYS: ${HOME_KEEPER_RETENTION_DAYS:-30}
      HOME_KEEPER_TIMEZONE: ${HOME_KEEPER_TIMEZONE:-UTC}
      HOME_KEEPER_CONTROLLER_URL: http://controller:8080
      HOME_KEEPER_READER_URL: http://reader:8080
      HOME_KEEPER_DATABASE_URL: postgresql://keeper@postgres:5432/keeper
      HOME_KEEPER_DATABASE_PASSWORD_FILE: /db-password/password
    volumes:
      - service-secret:/secrets
      - keeper-db-password:/db-password:ro
    # `collection` reaches the reader, `control` the controller and `database` Postgres.
    # Never home-assistant.
    networks: [dashboard, collection, control, database]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${HOME_KEEPER_PORT:-8000}/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
    depends_on:
      db-setup:
        condition: service_completed_successfully
  # Reads Home Assistant for the API: the only keeper container with the owner token.
  # Stateless: no /data, no loop. No published port: only the API reaches it, over `collection`.
  reader:
    build: .
    command: [python, -m, home_keeper.reader_service]
    restart: unless-stopped
    environment:
      HOME_KEEPER_HA_URL: http://homeassistant:8123
      HOME_KEEPER_HA_TOKEN_FILE: /ha-token/token
    volumes:
      - service-secret:/secrets:ro
      - ha-token:/ha-token:ro
    networks: [collection, home-assistant]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Healthy once it accepts connections, whether or not Home Assistant answers, so
    # `up --wait` does not return before the API can reach it.
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1', 8080), 3).close()"]
      interval: 2s
      timeout: 4s
      retries: 15
    depends_on:
      api:
        condition: service_healthy
      ha-setup:
        condition: service_completed_successfully
  # Opt-in light control: carries out the API's fixed light commands with its own token.
  controller:
    profiles: [control]
    build:
      context: .
      dockerfile: apps/controller/Dockerfile
    restart: unless-stopped
    environment:
      HOME_KEEPER_PORT: ${HOME_KEEPER_PORT:-8000}
      HOME_KEEPER_CONTROL_BACKEND: home_assistant
      HOME_KEEPER_HA_URL: http://homeassistant:8123
      HOME_KEEPER_HA_CONTROL_TOKEN_FILE: /ha-control-token/token
    volumes:
      - service-secret:/secrets:ro
      - ha-control-token:/ha-control-token:ro
    # No published port: only the API reaches it, over `control`.
    networks: [control, home-assistant]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      api:
        condition: service_healthy
      ha-setup:
        condition: service_completed_successfully
networks:
  dashboard:
  collection:
    internal: true
  # The API and the controller only.
  control:
    internal: true
  # Home Assistant, the reader and the controller; the API never joins it.
  home-assistant:
volumes:
  service-secret:
  home-assistant-config:
  ha-token:
  ha-owner:
  # The controller's token for the non-admin "Home Keeper control" user.
  ha-control-token:
