# Home Keeper with a bundled Home Assistant: `docker compose up --build --wait`.
name: home-keeper
# The demo lives in compose.demo.yaml; your own Home Assistant uses compose.external.yaml.
# Add `--profile agent` to also start the chat agent (compose.agent.yaml).
include:
  - compose.agent.yaml
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HA_PORT:-8123}:8123"
    volumes:
      - home-assistant-config:/config
    networks: [home-assistant]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
  # Onboards Home Assistant once and stores the collector's token. Exits when done.
  ha-setup:
    build: .
    entrypoint: [python, -m, home_keeper.ha_setup]
    command: [setup]
    environment:
      HOME_KEEPER_HA_URL: http://homeassistant:8123
      HOME_KEEPER_HA_PUBLIC_URL: http://127.0.0.1:${HA_PORT:-8123}
      # Old names forwarded bare, so a leftover .env value fails the startup check.
      OBSERVER_HA_URL:
      OBSERVER_HA_PUBLIC_URL:
      OBSERVER_HA_TOKEN_FILE:
      OBSERVER_HA_LOGIN_FILE:
    volumes:
      - ha-token:/ha-token
      - ha-owner:/ha-owner
    networks: [home-assistant]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      homeassistant:
        condition: service_started
  api:
    build: .
    ports:
      - "127.0.0.1:${HOME_KEEPER_PORT:-8000}:${HOME_KEEPER_PORT:-8000}"
    environment:
      HOME_KEEPER_PORT: ${HOME_KEEPER_PORT:-8000}
      HOME_KEEPER_BIND: 0.0.0.0
      HOME_KEEPER_SOURCE_ID: home_assistant
      HOME_KEEPER_HA_PUBLIC_URL: http://127.0.0.1:${HA_PORT:-8123}
      HOME_KEEPER_RETENTION_DAYS: ${HOME_KEEPER_RETENTION_DAYS:-30}
      HOME_KEEPER_RECONCILIATION_SECONDS: ${HOME_KEEPER_RECONCILIATION_SECONDS:-10}
      HOME_KEEPER_TIMEZONE: ${HOME_KEEPER_TIMEZONE:-UTC}
      # Old names forwarded bare, so a leftover .env value fails the startup check.
      OBSERVER_PORT:
      OBSERVER_BIND:
      OBSERVER_DB:
      OBSERVER_SOURCE_ID:
      OBSERVER_TOKEN_FILE:
      OBSERVER_HA_PUBLIC_URL:
      OBSERVER_RETENTION_DAYS:
      OBSERVER_RECONCILIATION_SECONDS:
      OBSERVER_TIMEZONE:
    volumes:
      - data:/data
      - service-secret:/secrets
    networks: [dashboard, collection]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${HOME_KEEPER_PORT:-8000}/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
  collector:
    build: .
    command: [python, -m, home_keeper.live]
    environment:
      HOME_KEEPER_PORT: ${HOME_KEEPER_PORT:-8000}
      HOME_KEEPER_RECONCILIATION_SECONDS: ${HOME_KEEPER_RECONCILIATION_SECONDS:-10}
      HOME_KEEPER_HA_URL: http://homeassistant:8123
      HOME_KEEPER_HA_TOKEN_FILE: /ha-token/token
      # Old names forwarded bare, so a leftover .env value fails the startup check.
      OBSERVER_PORT:
      OBSERVER_TOKEN_FILE:
      OBSERVER_RECONCILIATION_SECONDS:
      OBSERVER_HA_URL:
      OBSERVER_HA_TOKEN_FILE:
    volumes:
      - service-secret:/secrets:ro
      - ha-token:/ha-token:ro
    networks: [collection, home-assistant]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      api:
        condition: service_healthy
      ha-setup:
        condition: service_completed_successfully
networks:
  dashboard:
  collection:
    internal: true
  # Home Assistant and the collector only; the API never joins it.
  home-assistant:
volumes:
  data:
  service-secret:
  home-assistant-config:
  ha-token:
  ha-owner:
